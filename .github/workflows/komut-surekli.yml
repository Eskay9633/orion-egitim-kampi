name: komut-beyni-surekli

# Komut beyni (Türkçe → makine dili) gün boyu eğitim (sahibin isteği 2026-11-13: "komut beyni sohbet beyninin gerisinde
# kaldı; github'da gün boyu eğitiriz"). Her 6 saatte bir iş başlar, önceki işin checkpoint'inden (önbellek) devam eder
# (~5 saat), sonra değerlendirir. Güvenlik tabanını (app-floor.json) geçerse "komut-s-..." Release'i yayınlanır; işlem
# deposunun içe aktarıcısı yalnızca elle yazılmış sınavda mevcut modelden iyi ya da eşitse alır. Eşikler değişmez.
# Veri üreticisi / protokol değişince önbellek anahtarı değişir; 2026-11-21'den beri eğitim sıfırdan değil, en son
# checkpoint'ten (aynı sözlükle) yeni veriyle devam eder (kaldığı yerden devam, sahibin onayı).
# 2026-11-23 (sahibin isteği: "komut beyni sürekli farklı verilerle, Kaggle'sız"): her tur farklı tohumla başlar; üretici
# her turda başka cümle birleşimleri verir (aynı örnekleri ezberlemesin).
on:
  # 2026-11-21: saatlik zamanlayıcı saatlerce gecikiyordu; turları artık yedek-yayin işi zincirler (bir tur bitince,
  # başka eğitim yoksa sonrakini workflow_dispatch ile başlatır). Hedef dolunca iş eğitmeden biter.
  workflow_dispatch:
    inputs:
      steps:
        description: 'Toplam hedef adım (devam eden eğitimin hedefi)'
        default: '480000'
  push:
    branches: [main]
    paths:
      - 'kaggle/komut-surekli-istek.txt'

permissions:
  contents: write
  actions: write

# 2026-11-20 gece: elle başlatılan (push) koşu eski tarifeden kalan koşuyu beklemesin diye ayrı sıradadır; saatlik
# koşular başka bir eğitim sürerken eğitmeden biter (aşağıdaki "kontrol" işi), aynı checkpoint'ten iki dal çıkmaz.
concurrency:
  group: komut-beyni-surekli${{ github.event_name == 'push' && '-hemen' || '' }}
  cancel-in-progress: false

env:
  INPUT_STEPS: ${{ inputs.steps || '480000' }}

jobs:
  kontrol:
    runs-on: ubuntu-latest
    outputs:
      busy: ${{ steps.b.outputs.busy }}
    steps:
      - name: Başka eğitim sürüyor mu
        id: b
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh run list -R "$GITHUB_REPOSITORY" --workflow komut-surekli.yml --status in_progress --json databaseId -q "[.[] | select(.databaseId != ${{ github.run_id }})] | length" || echo 0)
          echo "süren başka koşu: $N"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$N" -gt 0 ]; then echo "busy=true" >> "$GITHUB_OUTPUT"; else echo "busy=false" >> "$GITHUB_OUTPUT"; fi
  train:
    needs: kontrol
    if: needs.kontrol.outputs.busy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      # Hedef adım (2026-11-21 gece, sahibin isteği: yarın 19:00 APK'ya kadar gelişsin): kaggle/komut-hedef.txt varsa
      # girdiyi ezer; zincir koşularının kendi girdisi eski kalsa da hedef depodan okunur.
      - name: Hedef adım
        run: |
          T=$(head -1 kaggle/komut-hedef.txt 2>/dev/null | tr -dc 0-9)
          echo "TOTAL_STEPS=${T:-$INPUT_STEPS}" >> "$GITHUB_ENV"
          echo "hedef: ${T:-$INPUT_STEPS}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bağımlılıklar
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r core-model/requirements.txt
      - name: Testler
        working-directory: core-model
        run: python -m pytest -q tests
      - name: Dış veri (MASSIVE + xSID)
        working-directory: core-model
        run: python -m orion_core.massive prepare --out work/ext --download
      - name: Çevrilmiş ek veri (CLINC150 → tr, komut-veri Release; yoksa yalnız MASSIVE)
        working-directory: core-model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T=$(gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^komut-veri-' | sort | tail -1 || true)
          if [ -n "$T" ]; then gh release download "$T" --pattern clinc-tr.jsonl.gz --dir work/ext --clobber && gunzip -f work/ext/clinc-tr.jsonl.gz && echo "ek veri: $T ($(wc -l < work/ext/clinc-tr.jsonl) satır)"; else echo "komut-veri Release yok"; fi
          D=$(gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^komut-dis-' | sort | tail -1 || true)
          if [ -n "$D" ]; then gh release download "$D" --pattern dis-tr.jsonl.gz --dir work/ext --clobber && gunzip -f work/ext/dis-tr.jsonl.gz && echo "dış veri: $D ($(wc -l < work/ext/dis-tr.jsonl) satır)"; else echo "komut-dis Release yok"; fi
      - name: Önceki checkpoint (önbellek)
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: core-model/work/run
          key: komut-surekli-${{ hashFiles('core-model/orion_core/datagen.py', 'core-model/orion_core/grammar.py', 'core-model/orion_core/copy.py', 'core-model/orion_core/massive.py', 'core-model/orion_core/train.py', 'core-model/orion_core/bpe.py', 'shared/protocol/**') }}-${{ github.run_id }}
          restore-keys: |
            komut-surekli-${{ hashFiles('core-model/orion_core/datagen.py', 'core-model/orion_core/grammar.py', 'core-model/orion_core/copy.py', 'core-model/orion_core/massive.py', 'core-model/orion_core/train.py', 'core-model/orion_core/bpe.py', 'shared/protocol/**') }}-
            komut-surekli-
      - name: Hedef doldu mu
        id: done
        run: |
          S=$(python -c "import json;print(json.load(open('core-model/work/run/status.json')).get('step',0))" 2>/dev/null || echo 0)
          echo "adım $S / $TOTAL_STEPS"
          if [ "$S" -ge "$TOTAL_STEPS" ]; then echo "done=true" >> "$GITHUB_OUTPUT"; else echo "done=false" >> "$GITHUB_OUTPUT"; fi
      - name: Eğit (kaldığı yerden, ~5 saat)
        if: steps.done.outputs.done != 'true'
        working-directory: core-model
        run: |
          python -m orion_core.train --out work/run --steps "$TOTAL_STEPS" --time-budget-min 290 --ext-data work/ext --ext-frac 0.07 --seed $((1234 + ${{ github.run_number }}))
          cat work/run/status.json
      - name: Checkpoint'i sakla (sonraki iş devam etsin)
        if: always() && steps.done.outputs.done != 'true'
        uses: actions/cache/save@v4
        with:
          path: core-model/work/run
          key: komut-surekli-${{ hashFiles('core-model/orion_core/datagen.py', 'core-model/orion_core/grammar.py', 'core-model/orion_core/copy.py', 'core-model/orion_core/massive.py', 'core-model/orion_core/train.py', 'core-model/orion_core/bpe.py', 'shared/protocol/**') }}-${{ github.run_id }}
      - name: Dışa aktar + manifest
        if: steps.done.outputs.done != 'true'
        working-directory: core-model
        run: |
          python -m orion_core.export --run work/run --out work/export
          python -m orion_core.manifest --dir work/export --run work/run --ext-data work/ext
      # Eğitimin başında taban geçilmeyebilir: o zaman Release yok, iş yeşil kalır, sonraki iş devam eder.
      - name: Güvenlik tabanı
        id: gate
        if: steps.done.outputs.done != 'true'
        continue-on-error: true
        working-directory: core-model
        run: python -m orion_core.evaluate --model work/export --gate --ext-data work/ext
      # 2026-11-20: Release oluşturma 403 verdiğinde model kaybolmasın: iş çıktısı olarak da saklanır (14 gün)
      - name: Model iş çıktısı olarak saklanır (yedek)
        if: always() && steps.done.outputs.done != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: komut-model-${{ github.run_id }}
          path: core-model/work/export/
          retention-days: 14
          if-no-files-found: ignore
      - name: Release olarak yayınla
        if: steps.gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STEP=$(python -c "import json;print(json.load(open('core-model/work/run/status.json'))['step'])")
          TAG="komut-s-$(date -u +%Y%m%d-%H%M)-a${STEP}"
          NOTES=$(python -c "import json;m=json.load(open('core-model/work/export/manifest.json'));print(json.dumps(m['eval'],ensure_ascii=False))")
          cd core-model/work/export
          cp ../../../shared/core-model/DIS-VERI.md .
          gh release create "$TAG" model.bin tokenizer.json parity.json manifest.json eval.json DIS-VERI.md \
            --target "$GITHUB_SHA" --title "Komut beyni (sürekli) $TAG" --notes "Adım $STEP / $TOTAL_STEPS · $NOTES"
      # Zincir (2026-11-21): botun başlattığı koşular workflow_run olayı üretmediği için (GITHUB_TOKEN) sonraki tur
      # buradan başlatılır: eğitim yapıldıysa, hedef dolmadıysa ve başka eğitim beklemiyorsa.
      - name: Sonraki eğitim turu
        if: always() && steps.done.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          S=$(python -c "import json;print(json.load(open('core-model/work/run/status.json')).get('step',0))" 2>/dev/null || echo 0)
          echo "adım $S / $TOTAL_STEPS"
          if [ "$S" -ge "$TOTAL_STEPS" ] || [ "$S" -eq 0 ]; then echo "zincir durur"; exit 0; fi
          N=$(gh run list -R "$GITHUB_REPOSITORY" --workflow komut-surekli.yml --json status,databaseId -q "[.[] | select(.status != \"completed\" and .databaseId != ${{ github.run_id }})] | length")
          if [ "$N" -gt 0 ]; then echo "başka eğitim bekliyor/sürüyor; zincir onunla sürer"; exit 0; fi
          gh workflow run komut-surekli.yml -R "$GITHUB_REPOSITORY" --ref main -f steps="$TOTAL_STEPS"
      - name: Özet
        if: always()
        run: |
          echo "### Komut beyni sürekli eğitim" >> "$GITHUB_STEP_SUMMARY"
          cat core-model/work/run/status.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Güvenlik tabanı: ${{ steps.gate.outcome }}" >> "$GITHUB_STEP_SUMMARY"
