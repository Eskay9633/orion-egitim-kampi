name: komut-deney

# Komut beyni deneyleri (aday sayılmaz; etiket "deney-komut-*", ön sürüm; karar sahibin). Ayar kaggle/komut-deney.txt:
#   "D_MODEL N_LAYER N_HEAD D_FF ADIM MASSIVE"  ör. "256 6 4 1024 10000 acik"  (MASSIVE: acik | kapali)
# 2026-11-17: MASSIVE'siz deney; 2026-11-19: model kapasitesi (boyut sorun değil, sahibin kararı).
on:
  workflow_dispatch:
    inputs:
      steps:
        description: 'Eğitim adımı'
        default: '10000'
  push:
    branches: [main]
    paths:
      - 'kaggle/komut-deney.txt'

permissions:
  contents: write

concurrency:
  group: komut-deney
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bağımlılıklar
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r core-model/requirements.txt
      - name: Testler
        working-directory: core-model
        run: python -m pytest -q tests
      # Gerçek Türkçe cümleler: MASSIVE 1.1 tr-TR (CC BY 4.0) eğitim + massive_tr, xSID 0.6 tr (CC BY-SA 4.0) xsid_tr.
      # Adresler ve sha256 orion_core/massive.py içinde sabit; indirme ya da özet tutmazsa iş DURUR (sessiz geri dönüş yok).
      - name: Dış veri (MASSIVE + xSID)
        working-directory: core-model
        run: python -m orion_core.massive prepare --out work/ext --download
      - name: Çevrilmiş ek veri (CLINC150 → tr, komut-veri Release; yoksa yalnız MASSIVE)
        working-directory: core-model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T=$(gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^komut-veri-' | sort | tail -1 || true)
          if [ -n "$T" ]; then gh release download "$T" --pattern clinc-tr.jsonl.gz --dir work/ext --clobber && gunzip -f work/ext/clinc-tr.jsonl.gz && echo "ek veri: $T ($(wc -l < work/ext/clinc-tr.jsonl) satır)"; else echo "komut-veri Release yok"; fi
      - name: Deney ayarı
        id: cfg
        run: |
          read D L H F N M < kaggle/komut-deney.txt || true
          D=${D:-192}; L=${L:-4}; H=${H:-4}; F=${F:-768}; N=${N:-10000}; M=${M:-acik}
          case "$D$L$H$F$N" in *[!0-9]*) echo "HATA: biçim 'D L H FF ADIM MASSIVE'"; exit 1;; esac
          echo "d=$D" >> "$GITHUB_OUTPUT"; echo "l=$L" >> "$GITHUB_OUTPUT"; echo "h=$H" >> "$GITHUB_OUTPUT"
          echo "f=$F" >> "$GITHUB_OUTPUT"; echo "n=$N" >> "$GITHUB_OUTPUT"; echo "m=$M" >> "$GITHUB_OUTPUT"
          echo "deney: d=$D katman=$L baş=$H ff=$F adım=$N massive=$M"
      - name: MASSIVE eğitim verisini çıkar (yalnız MASSIVE=kapali; değerlendirme kümeleri kalır)
        if: steps.cfg.outputs.m == 'kapali'
        working-directory: core-model
        run: ": > work/ext/massive-train.jsonl && echo 'MASSIVE eğitim satırı: 0'"
      - name: Eğit
        working-directory: core-model
        run: >-
          python -m orion_core.train --out work/run --steps ${{ steps.cfg.outputs.n }} --time-budget-min 270
          --ext-data work/ext --ext-frac 0.0625 --d-model ${{ steps.cfg.outputs.d }} --n-layer ${{ steps.cfg.outputs.l }}
          --n-head ${{ steps.cfg.outputs.h }} --d-ff ${{ steps.cfg.outputs.f }}
      - name: Dışa aktar + manifest
        working-directory: core-model
        run: |
          python -m orion_core.export --run work/run --out work/export
          python -m orion_core.manifest --dir work/export --run work/run --ext-data work/ext
      - name: Güvenlik tabanı (yanlış iş yapan model yayınlanmaz)
        working-directory: core-model
        run: python -m orion_core.evaluate --model work/export --gate --ext-data work/ext
      - name: Release olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="deney-komut-d${{ steps.cfg.outputs.d }}l${{ steps.cfg.outputs.l }}-${{ steps.cfg.outputs.m }}-$(date -u +%Y%m%d-%H%M)"
          NOTES=$(python -c "import json;m=json.load(open('core-model/work/export/manifest.json'));print(json.dumps(m['eval'],ensure_ascii=False))")
          cd core-model/work/export
          cp ../../../shared/core-model/DIS-VERI.md .
          gh release create "$TAG" model.bin tokenizer.json parity.json manifest.json eval.json DIS-VERI.md \
            --target "$GITHUB_SHA" --title "Komut beyni deneyi $TAG" --notes "Deney (aday değil): d=${{ steps.cfg.outputs.d }} katman=${{ steps.cfg.outputs.l }} ff=${{ steps.cfg.outputs.f }} massive=${{ steps.cfg.outputs.m }} · $NOTES" --prerelease
