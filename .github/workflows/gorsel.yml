name: gorsel

# Görsel verisi, ilk adım: açık lisanslı emoji görselleri (Twemoji CC BY 4.0, OpenMoji CC BY-SA 4.0) + Unicode CLDR
# Türkçe adları → "gorsel-ikon" Release'i (derlem-* DEĞİL: metin derlemine karışmaz). Lisans metni her çalışmada
# indirilip aranır; bulunamayan kaynak ALINMAZ. Noto Emoji: lisansı netleşmedi (doğrulanmadı), alınmaz.
# Tetikleme: kaggle/gorsel-istek.txt'ye işlemek ya da elle.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['kaggle/gorsel-istek.txt']

permissions:
  contents: write

concurrency:
  group: gorsel
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kaynakları indir (yalnız gereken klasörler)
        run: |
          set -e
          mkdir -p src
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/jdecked/twemoji src/twemoji
          git -C src/twemoji sparse-checkout set assets/72x72
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/hfg-gmuend/openmoji src/openmoji
          git -C src/openmoji sparse-checkout set color/72x72
          B=https://raw.githubusercontent.com/unicode-org/cldr/main
          curl -fsSL "$B/common/annotations/tr.xml" -o src/cldr-tr.xml
          curl -fsSL "$B/common/annotationsDerived/tr.xml" -o src/cldr-tr-derived.xml
          curl -fsSL "$B/unicode-license.txt" -o src/cldr-license.txt || curl -fsSL "$B/LICENSE" -o src/cldr-license.txt
          ls src/twemoji/assets/72x72 | wc -l; ls src/openmoji/color/72x72 | wc -l
      - name: Lisansları denetle ve paketle
        working-directory: core-model
        run: |
          python - <<'PY'
          import subprocess, sys
          from pathlib import Path
          from orion_core.corpus import gorsel
          s = Path("../src")
          lic = {"twemoji": (s / "twemoji" / "LICENSE-GRAPHICS"), "openmoji": (s / "openmoji" / "LICENSE.txt"),
                 "cldr": (s / "cldr-license.txt")}
          ok = {k: p.exists() and gorsel.license_ok(k, p.read_text(encoding="utf-8", errors="replace")) for k, p in lic.items()}
          print("lisans denetimi:", ok)
          if not ok["cldr"]:
              sys.exit("CLDR lisansı doğrulanamadı: Türkçe adlar olmadan görsel verisi üretilmez")
          args = ["--cldr", str(s / "cldr-tr.xml"), "--cldr", str(s / "cldr-tr-derived.xml"), "--out", "../gorsel-out"]
          if ok["twemoji"]:
              args += ["--twemoji", str(s / "twemoji" / "assets" / "72x72")]
          if ok["openmoji"]:
              args += ["--openmoji", str(s / "openmoji" / "color" / "72x72")]
          gorsel.main(args)
          PY
      - name: Yayınla (gorsel-ikon)
        run: |
          cd gorsel-out; ls -la
          cp ../src/cldr-license.txt CLDR-LICENSE.txt
          gh release delete gorsel-ikon -y --cleanup-tag 2>/dev/null || true
          ST=$(tr -d '\n ' < gorsel-stats.json)
          for i in 1 2 3 4; do
            gh release create gorsel-ikon --title "Görsel verisi: emoji + Türkçe adlar" \
              --notes "Görsel üretmeye hazırlık. $ST. Twemoji grafikleri CC BY 4.0 (© Twitter/X ve katkıda bulunanlar); OpenMoji CC BY-SA 4.0 (HfG Schwäbisch Gmünd); Türkçe adlar Unicode CLDR (Unicode License v3). Her satırda lisans ve atıf vardır." \
              *.jsonl.gz gorsel-stats.json CLDR-LICENSE.txt && break
            echo "yeniden deneniyor ($i)"; sleep $((i*20)); gh release delete gorsel-ikon -y --cleanup-tag 2>/dev/null || true
          done
