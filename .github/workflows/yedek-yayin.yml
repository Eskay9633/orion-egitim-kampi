name: yedek-yayin

# 2026-11-21: Sürekli eğitimde "Release olarak yayınla" adımı uzun işin sonunda 403 ("Resource not accessible by
# integration") alıyor; model Actions yedeği (komut-model-<run>) olarak kalıyor. Bu kısa iş, taze bir jetonla yedeği
# indirir, güvenlik tabanını (app-floor.json, eşikler değişmez) YENİDEN çalıştırır ve geçerse komut-s-... Release'ini açar.
# Tetik: sürekli eğitim bitince kendiliğinden, ya da kaggle/yedek-yayin.txt'ye run kimliği yazıp işlemek.
on:
  workflow_run:
    workflows: [komut-beyni-surekli]
    types: [completed]
  push:
    branches: [main]
    paths: ['kaggle/yedek-yayin.txt']
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Yedeği yayınlanacak koşu'
        required: true

permissions:
  contents: write
  actions: write

jobs:
  yayin:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hangi koşular
        id: runs
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then R="${{ github.event.workflow_run.id }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then R="${{ inputs.run_id }}"
          else R=$(grep -oE '[0-9]{8,}' kaggle/yedek-yayin.txt | tr '\n' ' '); fi
          echo "runs=$R" >> "$GITHUB_OUTPUT"; echo "koşular: $R"
      - name: Bağımlılıklar
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r core-model/requirements.txt
      - name: Dış veri (MASSIVE + xSID)
        working-directory: core-model
        run: python -m orion_core.massive prepare --out work/ext --download
      - name: Yedekleri indir, tabanı yeniden çalıştır, geçeni yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for R in ${{ steps.runs.outputs.runs }}; do
            D="yedek/$R"; mkdir -p "$D"
            if ! gh run download "$R" -R "$GITHUB_REPOSITORY" -n "komut-model-$R" -D "$D"; then echo "$R: yedek yok"; continue; fi
            [ -f "$D/manifest.json" ] || { echo "$R: manifest yok"; continue; }
            if gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json name -q '.[].name' | grep -q "yedek $R"; then echo "$R: zaten yayında"; continue; fi
            if ! (cd core-model && python -m orion_core.evaluate --model "../$D" --gate --ext-data work/ext); then echo "$R: taban geçilmedi, yayın yok"; continue; fi
            STEP=$(python -c "import json,sys;m=json.load(open('$D/manifest.json'));print(m.get('train_steps') or m.get('steps') or 0)")
            TAG="komut-s-$(date -u +%Y%m%d-%H%M)-a${STEP}"
            NOTES=$(python -c "import json;m=json.load(open('$D/manifest.json'));print(json.dumps(m.get('eval',{}),ensure_ascii=False))")
            cp shared/core-model/DIS-VERI.md "$D/" 2>/dev/null || true
            FILES=$(cd "$D" && ls model.bin tokenizer.json parity.json manifest.json eval.json DIS-VERI.md 2>/dev/null | sed "s|^|$D/|" | tr '\n' ' ')
            gh release create "$TAG" $FILES -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Komut beyni (sürekli) $TAG · yedek $R" --notes "Actions yedeğinden (koşu $R) · adım $STEP · $NOTES"
            echo "$R → $TAG"
          done
      # Zincir (2026-11-21): sürekli eğitim turu bittiyse ve başka eğitim sürmüyorsa sonraki tur başlar (hedef dolana dek;
      # hedef dolunca yeni tur eğitmeden biter). Elle yapılan yayınlarda (push) zincir çalışmaz.
      - name: Sonraki eğitim turu
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh run list -R "$GITHUB_REPOSITORY" --workflow komut-surekli.yml --json status -q '[.[] | select(.status != "completed")] | length')
          echo "süren/bekleyen eğitim: $N"
          if [ "$N" -gt 0 ]; then echo "başka eğitim var; zincir onun bitişinde sürer"; exit 0; fi
          # Biten tur gerçekten eğitim yaptıysa sürer (hedef dolunca tur eğitmeden biter ve zincir durur)
          R="${{ github.event.workflow_run.id }}"
          E=$(gh run view "$R" -R "$GITHUB_REPOSITORY" --json jobs -q '[.jobs[].steps[] | select(.name | startswith("Eğit")) | .conclusion] | first // ""')
          echo "biten turun eğitim adımı: $E"
          if [ "$E" != "success" ]; then echo "eğitim yapılmadı (hedef dolmuş ya da hata); zincir durur"; exit 0; fi
          gh workflow run komut-surekli.yml -R "$GITHUB_REPOSITORY" --ref main -f steps=270000
